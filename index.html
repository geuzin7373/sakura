<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galaxia de Sakura</title>
    <meta property="og:title" content="Galaxia de Sakura">
    <meta property="og:image" content="https://mi-universo-perfecto.netlify.app/assets/icon.webp">
    <meta property="og:url" content="https://mi-universo-perfecto.netlify.app/">
    <meta property="og:type" content="website">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Indie+Flower&display=swap" rel="stylesheet">
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>�</text></svg}">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            background-color: #000000;
            font-family: 'Indie Flower', cursive;
            cursor: grab;
            -webkit-user-select: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }

        body:active {
            cursor: grabbing;
        }

        canvas {
            display: block;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 1;
        }

        #main-title {
            position: absolute;
            top: 35px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 2.5em;
            line-height: 1.1;
            color: #ffe6f0;
            text-shadow: 0 0 12px #ff7bb9, 0 0 25px #ff4d9a, 0 0 40px rgba(255, 140, 190, 0.6);
            z-index: 10;
            pointer-events: none;
            text-align: center;
            white-space: nowrap;
        }

        #start-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: black;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            color: white;
            z-index: 9999;
            padding: 20px;
        }

        #music-start-overlay {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.7);
            z-index: 9998;
            backdrop-filter: blur(4px);
        }

        #music-start-button {
            border: none;
            border-radius: 999px;
            padding: 16px 32px;
            background: linear-gradient(135deg, #ff2b5e, #8b002f);
            color: #fff;
            font-size: 1.1em;
            font-family: 'Indie Flower', cursive;
            box-shadow: 0 0 25px rgba(255, 50, 90, 0.6);
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        #music-start-button:active,
        #music-start-button:hover {
            transform: scale(1.04);
            box-shadow: 0 0 30px rgba(255, 50, 90, 0.8);
        }

        #start-button-image {
            width: auto;
            height: auto;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 20px;
            animation: latido 1.5s infinite ease-in-out;
            user-select: none;
        }

        #start-button-image:hover {
            filter: drop-shadow(0 0 20px #FFFF00) drop-shadow(0 0 35px #FFD700);
            transform: scale(1.05);
        }

        @keyframes latido {

            0%,
            100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.08);
            }
        }

        #start-text {
            font-size: 1.8em;
            color: #ffdfe9;
            text-shadow: 0 0 8px #d94d68;
            text-align: center;
        }

        #love-card-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 100;
            backdrop-filter: blur(5px);
            cursor: pointer;
        }

        #petal-burst-layer {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 40;
            overflow: hidden;
        }

        #center-flower-overlay {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            pointer-events: none;
            opacity: 0;
            transform: scale(0.7);
            transition: opacity 0.35s ease, transform 0.35s ease;
            z-index: 60;
        }

        #center-flower-overlay.is-visible {
            opacity: 1;
            transform: scale(1);
        }

        #center-flower-image {
            width: min(40vw, 220px);
            max-width: 220px;
            height: auto;
            border-radius: 22px;
            box-shadow: 0 0 25px rgba(255, 168, 207, 0.75), 0 0 45px rgba(255, 125, 180, 0.45);
            filter: drop-shadow(0 0 18px rgba(255, 143, 199, 0.8));
            user-select: none;
        }

        #center-flower-caption {
            margin-top: 18px;
            color: #ff78b9;
            font-size: clamp(1.6rem, 3vw, 2.4rem);
            font-weight: 700;
            -webkit-text-stroke: 1px #fff0f7;
            paint-order: stroke fill;
            text-shadow: 0 2px 4px rgba(45, 0, 24, 0.95), 0 0 14px rgba(255, 77, 160, 1), 0 0 28px rgba(255, 105, 180, 0.9);
            letter-spacing: 0.04em;
            opacity: 1;
        }

        .petal-burst {
            position: absolute;
            width: 16px;
            height: 16px;
            border-radius: 55% 45% 60% 40%;
            background: radial-gradient(circle at 30% 30%, #fff8fb, #ffd9ee 35%, #f9a9d2 70%, #f17bbf 100%);
            box-shadow: 0 0 10px rgba(255, 150, 200, 0.7);
            opacity: 0;
            transform: translate(-50%, -50%) scale(0.5) rotate(var(--rot));
            animation: sakura-pop 900ms cubic-bezier(0.12, 0.72, 0.28, 1) forwards;
        }

        @keyframes sakura-pop {
            0% {
                opacity: 0;
                transform: translate(-50%, -50%) scale(0.3) rotate(var(--rot));
            }

            18% {
                opacity: 1;
            }

            100% {
                opacity: 0;
                transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(1.2) rotate(calc(var(--rot) + 180deg));
            }
        }

        #love-card {
            position: relative;
            width: 90%;
            max-width: 400px;
            aspect-ratio: 9 / 16;
            background-size: cover;
            background-position: center;
            border-radius: 20px;
            box-shadow: 0 0 30px #FFD700, 0 0 50px #FFA500;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 25px;
            text-align: center;
            overflow: hidden;
        }

        #love-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(0, 0, 0, 0.4);
            z-index: 1;
        }

        #love-card-text {
            position: relative;
            font-size: 3em;
            color: #ffffff;
            text-shadow: 0 0 8px black, 0 0 15px black;
            z-index: 2;
        }

        @media (max-width: 768px) {
            #main-title {
                font-size: 1.9em;
                top: 24px;
                white-space: normal;
                line-height: 1.2;
                max-width: 80vw;
            }

            #love-card {
                width: min(88vw, 360px);
            }

            #love-card-text {
                font-size: 2.4em;
            }
        }

        @media (max-width: 480px) {
            #main-title {
                font-size: 1.4em;
                top: 18px;
                white-space: normal;
                letter-spacing: 0.4px;
                line-height: 1.2;
                max-width: 82vw;
            }

            #love-card {
                width: min(90vw, 320px);
                padding: 18px;
            }

            #love-card-text {
                font-size: 2.1em;
            }
        }

        /* Decoração de Girassóis */
        .sunflower-decoration {
            position: fixed;
            font-size: 3.5em;
            z-index: 5;
            pointer-events: none;
            filter: drop-shadow(0 0 8px #FFD700);
        }

        .sunflower-tl {
            top: 10px;
            left: 15px;
            animation: rotateSunflower 20s linear infinite;
        }

        .sunflower-tr {
            top: 15px;
            right: 15px;
            animation: rotateSunflowerReverse 25s linear infinite;
            transform: scaleX(-1);
        }

        .sunflower-bl {
            bottom: 10px;
            left: 20px;
            animation: bounceSunflower 3s ease-in-out infinite;
        }

        .sunflower-br {
            bottom: 15px;
            right: 20px;
            animation: spinSunflower 15s linear infinite;
            transform: scaleX(-1);
        }

        .sunflower-center-left {
            top: 50%;
            left: 5%;
            transform: translateY(-50%);
            animation: floatSunflower 4s ease-in-out infinite;
            opacity: 0.7;
            font-size: 2.8em;
        }

        .sunflower-center-right {
            top: 50%;
            right: 5%;
            transform: translateY(-50%) scaleX(-1);
            animation: floatSunflowerReverse 4.5s ease-in-out infinite;
            opacity: 0.7;
            font-size: 2.8em;
        }

        @keyframes rotateSunflower {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        @keyframes rotateSunflowerReverse {
            0% {
                transform: scaleX(-1) rotate(0deg);
            }

            100% {
                transform: scaleX(-1) rotate(-360deg);
            }
        }

        @keyframes spinSunflower {
            0% {
                transform: scaleX(-1) rotate(360deg);
            }

            100% {
                transform: scaleX(-1) rotate(0deg);
            }
        }

        @keyframes bounceSunflower {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-20px);
            }
        }

        @keyframes floatSunflower {

            0%,
            100% {
                transform: translateY(-50%) translateX(0);
            }

            50% {
                transform: translateY(-50%) translateX(15px);
            }
        }

        @keyframes floatSunflowerReverse {

            0%,
            100% {
                transform: translateY(-50%) scaleX(-1) translateX(0);
            }

            50% {
                transform: translateY(-50%) scaleX(-1) translateX(-15px);
            }
        }

        @media (max-width: 768px) {
            .sunflower-decoration {
                font-size: 2.5em;
            }

            .sunflower-center-left,
            .sunflower-center-right {
                font-size: 2em;
            }
        }

        @media (max-width: 480px) {
            .sunflower-decoration {
                font-size: 2em;
            }

            .sunflower-center-left,
            .sunflower-center-right {
                display: none;
            }
        }
    </style>
</head>

<body>

    <script type="importmap">
    { "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",

    <script>
        const bgAudio = document.getElementById('bg-audio');
        const brilhoAudio = document.getElementById('brilho-audio');

        const startMusic = async () => {
            if (!bgAudio) return;
            if (!bgAudio.src || !bgAudio.src.includes('musicafundo.mp3')) {
                bgAudio.src = 'audio/musicafundo.mp3';
                bgAudio.load();
            }
            if (!bgAudio.paused) return;
            bgAudio.volume = 0.5;
            try {
                await bgAudio.play();
            } catch (error) {
                // navegador bloqueia autoplay até o primeiro toque/arraste
            }
        };

        const playBrilhoAudio = async () => {
            if (!brilhoAudio) return;
            if (!brilhoAudio.src || !brilhoAudio.src.includes('brilho.mp3')) {
                brilhoAudio.src = 'audio/brilho.mp3';
                brilhoAudio.load();
            }

            brilhoAudio.currentTime = 0;
            brilhoAudio.volume = 0.8;

            try {
                await brilhoAudio.play();
            } catch (error) {
                // áudio só é liberado após interação do usuário, o que já acontece no clique
            }
        };

        const startOnInteraction = () => {
            startMusic();
        };

        document.addEventListener('pointerdown', startOnInteraction, { passive: true });
        document.addEventListener('touchstart', startOnInteraction, { passive: true });
        document.addEventListener('pointermove', (event) => {
            if (event.pointerType === 'touch' || event.touches) {
                startMusic();
            }
        }, { passive: true });

        document.addEventListener('contextmenu', event => event.preventDefault());
        document.onkeydown = function (e) {
            if (e.keyCode == 123 || (e.ctrlKey && e.shiftKey && (e.keyCode == 'I'.charCodeAt(0) || e.keyCode == 'J'.charCodeAt(0) || e.keyCode == 'C'.charCodeAt(0))) || (e.ctrlKey && (e.keyCode == 'U'.charCodeAt(0) || e.keyCode == 'S'.charCodeAt(0)))) {
                return false;
            }
        };
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

        // ===================================================================
        // =============== MÓDULO DE AJUSTES EDITABLE ========================
        // ===================================================================
        const isLowPowerDevice = !!(navigator.hardwareConcurrency && navigator.hardwareConcurrency <= 4);
        const qualityScale = isLowPowerDevice ? 0.45 : 0.7;

        const CONFIG = {
            galaxy: { rotationSpeed: 0.12, centerExclusionRadius: 45 },
            elementExclusionRadius: 40,
            blackHole: { radius: 12, segments: 64, color1: '#090309', color2: '#1b0d18' },

            accretionRing: {
                innerRadius: 18, outerRadius: 32, segments: 128,
                centerColor: '#fff1f7',
                midColor: '#ff7eb6',
                edgeColor: '#4f1839',
                emissiveIntensity: 1.5,
            },
            particles: {
                // === NUBE PRINCIPAL OVOIDE (plano ecuatorial, densa) ===
                coreStars: {
                    count: Math.round(20000 * qualityScale),
                    radius: 120,
                    maxHeight: 60,
                    size: 0.25
                },

                // === CAPA SUPERIOR E INFERIOR — forma esférica achatada ===
                sphericalHalo: {
                    count: Math.round(18000 * qualityScale),
                    radiusXZ: 110,
                    radiusY: 55,
                    size: 0.18,
                    minDistFromCenter: 28
                },

                backgroundStars: { count: Math.round(5000 * qualityScale), radius: 500, size: 0.2 },

                // === TEXTOS FLORES AMARILLAS ===
                texts: {
                    count: Math.round(50 * qualityScale), width: 45, height: 20,
                    minRadius: null, maxRadius: 120,
                    content: [

                        "Pura luz ✨",
                        " Você  é a Luz do dia ",
                        "É muito especial✨",
                        "Flores para ti ",
                        "O detalhe rosa ",
                        "Você ilumina tudo ",
                        "Você é incrível ", "Linda",
                        "Perfeita"],
                    colors: [
                        { fill: '#FFF1F7', shadow: '#FF8FBD' },
                        { fill: '#FFE4F0', shadow: '#F56FA8' },
                        { fill: '#FFFFFF', shadow: '#FFB6D4' }
                    ]
                },
                images: {
                    count: Math.round(60 * qualityScale), size: 12,
                    minRadius: null, maxRadius: 120,
                    emojis: ['�', '✨'],
                    paths: [
                        'images/sakura1.png',
                        'images/sakura2.png',
                        'images/sakura2.1.png',
                        'images/sakura3.png',
                        'images/sakura4.webp',
                        'images/sakura5.png',
                        'images/sakura6.png',
                        'images/sakura7.png',
                        'images/sakura8.png',
                        'images/sakura9.webp',
                        'images/sakura10.png',
                        'images/sakura11.png'
                    ]
                }
            },

            loveCards: {
                images: [
                    'images/sakura1.png',
                    'images/sakura2.png',
                    'images/sakura2.1.png',
                    'images/sakura3.png',
                    'images/sakura4.webp',
                    'images/sakura5.png',
                    'images/sakura6.png',
                    'images/sakura7.png',
                    'images/sakura8.png',
                    'images/sakura9.webp',
                    'images/sakura10.png',
                    'images/sakura11.png'
                ],
                phrases: [
                    "Eres una persona llena de luz que ilumina la vida de quienes te rodean.⭐ ",
                    "Hoy quiero celebrar tu vida y desearte que tu mundo siempre esté lleno de colores hermosos. ",
                    "Que estas flores amarillas te recuerden lo valiosa que es tu compañía. ✨",
                    "Un pequeño detalle para agradecerte por hacer de mis días algo mucho más especial. "
                ]
            },

            shootingStars: {
                enabled: true,
                spawnProbability: 0.01,
                speed: 1.2
            },
            lighting: {
                ambientLight: { color: '#ffeaf5', intensity: 0.2 },
                pointLight: { color: '#ff7bb6', intensity: 3.1, distance: 350 }
            },
            bloomEffect: { threshold: 0.6, strength: 0.8, radius: 0.4 },
            cameraControls: { minDistance: 30, maxDistance: 250 }
        };
        // ===================================================================

        let scene, camera, renderer, controls, galaxyGroup, clock, sphereMaterial, composer;
        let blackHoleMesh;
        let loveTexts = [], loveImages = [], shootingStars = [];
        let textureLoader;
        let occupiedPositions = [];
        let raycaster, mouse;
        let currentCardIndex = 0;
        let centerFlowerTimeout = null;

        function init() {
            scene = new THREE.Scene();
            clock = new THREE.Clock();
            raycaster = new THREE.Raycaster();
            mouse = new THREE.Vector2();
            textureLoader = new THREE.TextureLoader();

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('galaxy-canvas'), antialias: true });
            renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.5));
            renderer.setSize(window.innerWidth, window.innerHeight);

            controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true; controls.dampingFactor = 0.05;
            controls.minDistance = CONFIG.cameraControls.minDistance;
            controls.maxDistance = CONFIG.cameraControls.maxDistance;

            const renderScene = new RenderPass(scene, camera);
            const bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.5, 0.4, 0.85);
            bloomPass.threshold = CONFIG.bloomEffect.threshold;
            bloomPass.strength = CONFIG.bloomEffect.strength;
            bloomPass.radius = CONFIG.bloomEffect.radius;
            composer = new EffectComposer(renderer);
            composer.addPass(renderScene);
            composer.addPass(bloomPass);

            const { ambientLight, pointLight } = CONFIG.lighting;
            scene.add(new THREE.AmbientLight(ambientLight.color, ambientLight.intensity));
            const mainLight = new THREE.PointLight(pointLight.color, pointLight.intensity, pointLight.distance);
            mainLight.position.set(0, 0, 0);
            scene.add(mainLight);

            galaxyGroup = new THREE.Group();
            scene.add(galaxyGroup);

            createBlackHole();
            createCoreStars();
            createSphericalHalo();
            createBackgroundStars();
            createLoveElements();

            window.addEventListener('resize', onWindowResize);
            renderer.domElement.addEventListener('click', onCanvasClick);
            onWindowResize();
            animate();
        }

        function createBlackHole() {
            const bhConfig = CONFIG.blackHole;
            const ringConfig = CONFIG.accretionRing;
            sphereMaterial = new THREE.ShaderMaterial({
                uniforms: { uTime: { value: 0.0 }, uColor1: { value: new THREE.Color(bhConfig.color1) }, uColor2: { value: new THREE.Color(bhConfig.color2) } },
                vertexShader: `varying vec2 vUv; void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
                fragmentShader: `uniform float uTime; uniform vec3 uColor1; uniform vec3 uColor2; varying vec2 vUv; float noise(vec2 st) { return fract(sin(dot(st.xy, vec2(12.9898, 78.233))) * 43758.5453123); } void main() { float n = noise(vUv * 4.0 + uTime * 0.1); vec3 mixedColor = mix(uColor1, uColor2, n); gl_FragColor = vec4(mixedColor, 1.0); }`
            });
            blackHoleMesh = new THREE.Mesh(new THREE.SphereGeometry(bhConfig.radius, bhConfig.segments, bhConfig.segments), sphereMaterial);
            scene.add(blackHoleMesh);
            const ringGeometry = new THREE.RingGeometry(ringConfig.innerRadius, ringConfig.outerRadius, ringConfig.segments);
            const ringMaterial = new THREE.ShaderMaterial({
                uniforms: { innerRadius: { value: ringConfig.innerRadius }, outerRadius: { value: ringConfig.outerRadius }, centerColor: { value: new THREE.Color(ringConfig.centerColor) }, midColor: { value: new THREE.Color(ringConfig.midColor) }, edgeColor: { value: new THREE.Color(ringConfig.edgeColor) }, emissiveIntensity: { value: ringConfig.emissiveIntensity } },
                vertexShader: `varying vec3 vPosition; void main() { vPosition = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
                fragmentShader: `uniform float innerRadius; uniform float outerRadius; uniform vec3 centerColor; uniform vec3 midColor; uniform vec3 edgeColor; uniform float emissiveIntensity; varying vec3 vPosition; void main() { float distance = length(vPosition.xy); float normalizedDistance = clamp((distance - innerRadius) / (outerRadius - innerRadius), 0.0, 1.0); vec3 finalColor; if (normalizedDistance < 0.5) { finalColor = mix(centerColor, midColor, normalizedDistance * 2.0); } else { finalColor = mix(midColor, edgeColor, (normalizedDistance - 0.5) * 2.0); } float glowFactor = 1.0 - smoothstep(0.0, 1.0, normalizedDistance); vec3 emissiveColor = finalColor * emissiveIntensity * glowFactor; gl_FragColor = vec4(finalColor + emissiveColor, 1.0); }`,
                side: THREE.DoubleSide
            });
            const goldenRing = new THREE.Mesh(ringGeometry, ringMaterial);
            goldenRing.rotation.x = Math.PI / 2;
            scene.add(goldenRing);
        }

        function createCoreStars() {
            const coreConfig = CONFIG.particles.coreStars;
            const geometry = new THREE.BufferGeometry();
            const positions = new Float32Array(coreConfig.count * 3);
            const colors = new Float32Array(coreConfig.count * 3);
            const color = new THREE.Color();
            for (let i = 0; i < coreConfig.count; i++) {
                const distance = CONFIG.accretionRing.outerRadius + Math.random() * (coreConfig.radius - CONFIG.accretionRing.outerRadius);
                const angle = Math.random() * Math.PI * 2;
                const y = (Math.random() - 0.5) * coreConfig.maxHeight * Math.pow(1 - (distance / coreConfig.radius), 1.5);
                positions.set([Math.cos(angle) * distance, y, Math.sin(angle) * distance], i * 3);

                // Cores em tons de sakura e rosa delicado
                const hue = 0.88 + Math.random() * 0.12;
                const saturation = 0.72 + Math.random() * 0.18;
                const lightness = 0.46 + Math.random() * 0.18;
                color.setHSL(hue % 1, saturation, lightness);
                colors.set([color.r, color.g, color.b], i * 3);
            }
            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
            const material = new THREE.PointsMaterial({ size: coreConfig.size, blending: THREE.AdditiveBlending, vertexColors: true, transparent: true });
            galaxyGroup.add(new THREE.Points(geometry, material));
        }

        function createSphericalHalo() {
            const haloConfig = CONFIG.particles.sphericalHalo;
            const geometry = new THREE.BufferGeometry();
            const positions = new Float32Array(haloConfig.count * 3);
            const colors = new Float32Array(haloConfig.count * 3);
            const color = new THREE.Color();

            let filled = 0;
            while (filled < haloConfig.count) {
                const rx = (Math.random() * 2 - 1);
                const ry = (Math.random() * 2 - 1);
                const rz = (Math.random() * 2 - 1);

                if (rx * rx + ry * ry + rz * rz > 1.0) continue;

                const x = rx * haloConfig.radiusXZ;
                const y = ry * haloConfig.radiusY;
                const z = rz * haloConfig.radiusXZ;

                const distFromCenter = Math.sqrt(x * x + y * y + z * z);
                if (distFromCenter < haloConfig.minDistFromCenter) continue;

                const rNorm = distFromCenter / Math.max(haloConfig.radiusXZ, haloConfig.radiusY);
                if (Math.random() > Math.pow(1.0 - rNorm * 0.7, 1.2)) continue;

                positions.set([x, y, z], filled * 3);

                // Halo em tons suaves de sakura
                const hue = 0.9 + Math.random() * 0.14;
                const saturation = 0.7 + Math.random() * 0.18;
                const lightness = 0.42 + Math.random() * 0.2;
                color.setHSL(hue % 1, saturation, lightness);
                colors.set([color.r, color.g, color.b], filled * 3);

                filled++;
            }

            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

            const material = new THREE.PointsMaterial({
                size: haloConfig.size,
                blending: THREE.AdditiveBlending,
                vertexColors: true,
                transparent: true,
                opacity: 0.65
            });

            galaxyGroup.add(new THREE.Points(geometry, material));
        }

        function createEmojiTexture(emoji) {
            const canvas = document.createElement('canvas');
            canvas.width = 256;
            canvas.height = 256;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = 'rgba(0, 0, 0, 0)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.font = 'bold 200px Arial';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillStyle = '#FFFFFF';
            ctx.fillText(emoji, canvas.width / 2, canvas.height / 2);

            const texture = new THREE.CanvasTexture(canvas);
            texture.colorSpace = THREE.SRGBColorSpace;
            texture.magFilter = THREE.LinearFilter;
            texture.minFilter = THREE.LinearFilter;
            return texture;
        }



        function createCircularTextureFromImagePath(imagePath) {
            return new Promise((resolve, reject) => {
                const img = new Image();
                img.crossOrigin = 'anonymous';
                img.onload = () => {
                    const size = Math.max(img.width, img.height);
                    const canvas = document.createElement('canvas');
                    canvas.width = size;
                    canvas.height = size;
                    const ctx = canvas.getContext('2d');

                    ctx.clearRect(0, 0, size, size);
                    ctx.beginPath();
                    ctx.arc(size / 2, size / 2, size / 2, 0, Math.PI * 2);
                    ctx.closePath();
                    ctx.clip();
                    ctx.drawImage(img, (size - img.width) / 2, (size - img.height) / 2, img.width, img.height);

                    const texture = new THREE.CanvasTexture(canvas);
                    texture.colorSpace = THREE.SRGBColorSpace;
                    texture.needsUpdate = true;
                    resolve(texture);
                };
                img.onerror = () => reject(new Error('Erro ao carregar imagem: ' + imagePath));
                img.src = imagePath;
            });
        }

        async function createLoveElements() {
            const textConfig = CONFIG.particles.texts;
            const imageConfig = CONFIG.particles.images;

            for (let i = 0; i < textConfig.count; i++) {
                const colorData = textConfig.colors[i % textConfig.colors.length];
                const texture = createTextTexture(textConfig.content[i % textConfig.content.length], colorData);
                const material = new THREE.MeshPhongMaterial({ map: texture, transparent: true, alphaTest: 0.1, emissive: colorData.fill, emissiveIntensity: 1.2 });
                const textMesh = new THREE.Mesh(new THREE.PlaneGeometry(textConfig.width, textConfig.height), material);
                setElementOrbitPosition(textMesh, textConfig.minRadius, textConfig.maxRadius);
                galaxyGroup.add(textMesh); loveTexts.push(textMesh);
            }

            const imagePaths = [...imageConfig.paths];
            const imageTextures = await Promise.all(
                Array.from({ length: imageConfig.count }, () => {
                    const randomPath = imagePaths[Math.floor(Math.random() * imagePaths.length)];
                    return createCircularTextureFromImagePath(randomPath);
                })
            );

            imageTextures.forEach((texture) => {
                const material = new THREE.MeshBasicMaterial({
                    map: texture,
                    transparent: true,
                    alphaTest: 0.05,
                    side: THREE.DoubleSide,
                    depthWrite: false
                });

                const imageMesh = new THREE.Mesh(new THREE.PlaneGeometry(imageConfig.size, imageConfig.size), material);
                setElementOrbitPosition(imageMesh, imageConfig.minRadius, imageConfig.maxRadius);
                galaxyGroup.add(imageMesh);
                loveImages.push(imageMesh);
            });
        }

        function createBackgroundStars() {
            const bgConfig = CONFIG.particles.backgroundStars;
            const geometry = new THREE.BufferGeometry();
            const positions = new Float32Array(bgConfig.count * 3);
            for (let i = 0; i < bgConfig.count; i++) {
                const r = bgConfig.radius;
                positions.set([(Math.random() - 0.5) * 2 * r, (Math.random() - 0.5) * 2 * r, (Math.random() - 0.5) * 2 * r], i * 3);
            }
            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            const material = new THREE.PointsMaterial({ size: bgConfig.size, color: 0xffd7eb, transparent: true, opacity: 0.7 });
            scene.add(new THREE.Points(geometry, material));
        }

        function createShootingStar() {
            const geometry = new THREE.BufferGeometry();
            geometry.setAttribute('position', new THREE.BufferAttribute(new Float32Array([0, 0, 0]), 3));
            const material = new THREE.PointsMaterial({ color: 0xffffff, size: 1.8, blending: THREE.AdditiveBlending, transparent: true });
            const star = new THREE.Points(geometry, material);

            const [x, y, z] = [THREE.MathUtils.randFloatSpread(800), THREE.MathUtils.randFloat(100, 300), THREE.MathUtils.randFloatSpread(800)];
            star.position.set(x, y, z);

            star.userData.velocity = new THREE.Vector3(
                (Math.random() < 0.5 ? -1 : 1) * CONFIG.shootingStars.speed,
                -CONFIG.shootingStars.speed * 0.5,
                (Math.random() - 0.5) * 2
            );
            star.userData.life = 0;

            shootingStars.push(star);
            scene.add(star);
        }

        function setElementOrbitPosition(element, minRadius, maxRadius) {
            const safeMinRadius = minRadius || CONFIG.elementExclusionRadius;
            const safeMaxRadius = maxRadius || CONFIG.particles.coreStars.radius;
            const minSeparation = 18; const maxAttempts = 50;
            let validPosition = false; let attempts = 0;
            let finalPosition = { x: 0, y: 0, z: 0 };
            while (!validPosition && attempts < maxAttempts) {
                attempts++;
                const radius = safeMinRadius + Math.random() * (safeMaxRadius - safeMinRadius);
                const theta = Math.random() * Math.PI * 2;
                const maxVerticalOffset = 15;
                const y = (Math.random() - 0.5) * maxVerticalOffset;
                const x = radius * Math.cos(theta); const z = radius * Math.sin(theta);
                validPosition = true;
                for (let pos of occupiedPositions) {
                    const distance = Math.sqrt(Math.pow(x - pos.x, 2) + Math.pow(y - pos.y, 2) + Math.pow(z - pos.z, 2));
                    if (distance < minSeparation) { validPosition = false; break; }
                }
                if (validPosition) finalPosition = { x, y, z };
            }
            element.position.set(finalPosition.x, finalPosition.y, finalPosition.z);
            occupiedPositions.push(finalPosition);
        }

        function createTextTexture(text, color) {
            const canvas = document.createElement('canvas'); canvas.width = 1536; canvas.height = 512;
            const context = canvas.getContext('2d');
            context.font = '84px "Indie Flower", cursive'; context.fillStyle = color.fill;
            context.textAlign = 'center'; context.textBaseline = 'middle';
            context.shadowColor = color.shadow; context.shadowBlur = 3;
            const words = text.split(' '); let lines = []; let currentLine = words[0];
            const maxWidth = canvas.width - 100, lineHeight = 100;
            for (let i = 1; i < words.length; i++) {
                const testLine = currentLine + ' ' + words[i];
                if (context.measureText(testLine).width > maxWidth && currentLine.length > 0) { lines.push(currentLine); currentLine = words[i]; }
                else { currentLine = testLine; }
            }
            lines.push(currentLine);
            const startY = canvas.height / 2 - (lines.length - 1) * lineHeight / 2;
            lines.forEach((line, index) => context.fillText(line, canvas.width / 2, startY + index * lineHeight));
            return new THREE.CanvasTexture(canvas);
        }

        function createRoundedImageTexture(texture) {
            const img = texture.image; const maxSize = 512;
            const w = (img.width > img.height) ? maxSize : (img.width / img.height) * maxSize;
            const h = (img.width > img.height) ? (img.height / img.width) * maxSize : maxSize;
            const canvas = document.createElement('canvas'); canvas.width = w; canvas.height = h;
            const ctx = canvas.getContext('2d');
            ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'high';

            const r = Math.min(w, h) * 0.1;
            ctx.clearRect(0, 0, w, h);
            ctx.beginPath(); ctx.moveTo(r, 0); ctx.lineTo(w - r, 0); ctx.quadraticCurveTo(w, 0, w, r);
            ctx.lineTo(w, h - r); ctx.quadraticCurveTo(w, h, w - r, h); ctx.lineTo(r, h);
            ctx.quadraticCurveTo(0, h, 0, h - r); ctx.lineTo(0, r); ctx.quadraticCurveTo(0, 0, r, 0);
            ctx.closePath(); ctx.clip();
            ctx.drawImage(img, 0, 0, w, h);

            const newTexture = new THREE.CanvasTexture(canvas);
            newTexture.colorSpace = THREE.SRGBColorSpace; newTexture.generateMipmaps = false;
            newTexture.minFilter = THREE.LinearFilter; newTexture.magFilter = THREE.LinearFilter;
            return newTexture;
        }

        function onWindowResize() {
            const width = window.innerWidth, height = window.innerHeight;
            renderer.setSize(width, height);
            composer.setSize(width, height);
            camera.aspect = width / height;
            camera.position.set(0, 35, width < 768 ? 150 : 120);
            camera.updateProjectionMatrix();
        }

        function createSakuraBurst(x, y) {
            const layer = document.getElementById('petal-burst-layer');
            if (!layer) return;

            const petalCount = 28;
            for (let i = 0; i < petalCount; i++) {
                const petal = document.createElement('span');
                petal.className = 'petal-burst';
                petal.style.left = `${x}px`;
                petal.style.top = `${y}px`;
                petal.style.setProperty('--rot', `${(Math.random() * 360).toFixed(2)}deg`);
                petal.style.setProperty('--dx', `${(Math.random() * 180 - 90).toFixed(2)}px`);
                petal.style.setProperty('--dy', `${(Math.random() * 180 - 90).toFixed(2)}px`);
                petal.style.width = `${(Math.random() * 10 + 10).toFixed(2)}px`;
                petal.style.height = `${(Math.random() * 10 + 10).toFixed(2)}px`;
                petal.style.opacity = '0';
                layer.appendChild(petal);

                setTimeout(() => petal.remove(), 950);
            }
        }

        function showCenterFlower() {
            const overlay = document.getElementById('center-flower-overlay');
            if (!overlay) return;

            overlay.classList.remove('is-visible');
            void overlay.offsetWidth;
            overlay.classList.add('is-visible');

            playBrilhoAudio();

            const centerX = window.innerWidth / 2;
            const centerY = window.innerHeight / 2;
            createSakuraBurst(centerX, centerY);

            if (centerFlowerTimeout) clearTimeout(centerFlowerTimeout);
            centerFlowerTimeout = setTimeout(() => {
                overlay.classList.remove('is-visible');
            }, 1800);
        }

        function onCanvasClick(event) {
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = - (event.clientY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);

            const blackHoleHit = raycaster.intersectObject(blackHoleMesh, false);
            if (blackHoleHit.length) {
                showCenterFlower();
                return;
            }

            const intersects = raycaster.intersectObjects(loveImages, false);
            if (!intersects.length) return;

            const hit = intersects[0];
            const point = hit.point.clone();
            point.project(camera);

            const screenX = (point.x * 0.5 + 0.5) * window.innerWidth;
            const screenY = (-point.y * 0.5 + 0.5) * window.innerHeight;

            createSakuraBurst(screenX, screenY);
        }

        function showLoveCard() {
            const overlay = document.getElementById('love-card-overlay');
            const card = document.getElementById('love-card');
            const text = document.getElementById('love-card-text');
            const cardConfig = CONFIG.loveCards;

            if (cardConfig.images.length > 0) {
                card.style.backgroundImage = `url('${cardConfig.images[currentCardIndex]}')`;
                currentCardIndex = (currentCardIndex + 1) % cardConfig.images.length;
            } else {
                card.style.backgroundImage = 'none';
            }

            text.textContent = cardConfig.phrases[currentCardIndex % cardConfig.phrases.length];
            overlay.style.display = 'flex';
        }

        function hideLoveCard() {
            document.getElementById('love-card-overlay').style.display = 'none';
        }

        function animate() {
            requestAnimationFrame(animate);
            const elapsedTime = clock.getElapsedTime();
            galaxyGroup.rotation.y = elapsedTime * CONFIG.galaxy.rotationSpeed;
            if (sphereMaterial) sphereMaterial.uniforms.uTime.value = elapsedTime;

            loveTexts.forEach(t => t.lookAt(camera.position));
            loveImages.forEach(i => i.lookAt(camera.position));

            if (CONFIG.shootingStars.enabled && Math.random() < CONFIG.shootingStars.spawnProbability) {
                createShootingStar();
            }

            shootingStars.forEach((star, index) => {
                star.position.add(star.userData.velocity);
                star.userData.life++;
                if (star.userData.life > 300) {
                    scene.remove(star);
                    shootingStars.splice(index, 1);
                }
            });

            controls.update();
            composer.render();
        }

        init();



        document.getElementById('love-card-overlay').addEventListener('click', hideLoveCard);
    </script>
